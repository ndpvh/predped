url: https://github.com/ndpvh/predped

template:
  bootstrap: 5
  light-switch: true 
  theme: github-light
  theme-dark: github-dark
  includes:
    in_header: |
      <script type="text/javascript" async="" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-MML-AM_CHTML"></script>

authors:
  Niels Vanhasbroeck:
    href: https://ndpvh.github.io
  Andrew Heathcote:
    href: https://www.ampl-psych.com/team/andrew-heathcote/

repo:
  url:
    home: https://ndpvh.github.io/predped
    source: https://github.com/ndpvh/predped/tree/main/
    issue: https://github.com/ndpvh/predped/issues/
    branch: main

navbar:
  structure:
    left: [reference, articles]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Usage
      menu:
      - text: Theoretical Background
        href: articles/theory.html
      - text: Simulations
        href: articles/simulation.html
      - text: Advanced Simulations
        href: articles/advanced_simulation.html
      - text: Estimation
        href: articles/estimation.html
    github:
      icon: fa-github
      href: https://github.com/ndpvh/predped/
      aria-label: Github

reference:
  - title: Classes
    contents: has_concept("classes")
  - title: General Methods
    contents: has_concept("methods")
  - title: Object Manipulation
    contents: has_concept("object")
  - title: Goal Manipulation
    contents: has_concept("goal")
  - title: Simulation
    contents: has_concept("simulation")
  - title: Estimation
    contents: has_concept("estimation")
  - title: Movement
    contents: has_concept("movement")
  - title: Routing
    contents: has_concept("routing")
  - title: Utility Framework
    contents: has_concept("utility")
  - title: Parameters
    contents: has_concept("parameters")
  - title: Data Transformation
    contents: has_concept("data")
  - title: Helper Functions
    contents: has_concept("helper")
  - title: Getters and Setters
    contents: has_concept("getter")

